version: '3.8'

services:
  streamlit-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: akira-sales
    image: streamlit-app:v1
    env_file:
      - .env
    ports:
      - "8501:8501"
    command: ["./scripts/run.sh", "--server.address=0.0.0.0", "--server.port=8501"]